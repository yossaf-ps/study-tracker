<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابع المذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F4F7FF;
  --surface: #FFFFFF;
  --ink: #1B2340;
  --muted: #5E6A8C;
  --line: #E1E7F7;
  --accent: #3D6BFF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6ECFF;
  --ok: #13A06F; --ok-soft: #D9F5E9; --on-ok: #FFFFFF;
  --warn: #B86B00; --warn-soft: #FFEFCC;
  --bad: #D92D48; --bad-soft: #FFE1E6;
  --c1: #3D6BFF; --c1s: #E6ECFF;
  --c2: #FF5C8A; --c2s: #FFE3EC;
  --c3: #D98200; --c3s: #FFF0D1;
  --c4: #0E9F90; --c4s: #D8F6F2;
  --c5: #7C4DFF; --c5s: #EEE6FF;
  --c6: #F2601F; --c6s: #FFE6DA;
  --sun: #FFD23F; --sun-ink: #1B2340; --hero-ok: #0B7A52; --hero-bad: #C21F3A;
  --f-display: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121733; --surface: #1B2147; --ink: #F1F3FF; --muted: #A7B0D6; --line: #2B3463;
    --accent: #7C9BFF; --accent-ink: #0E1330; --accent-soft: #26315F;
    --ok: #4BD9A0; --ok-soft: #14392D; --on-ok: #0E1330;
    --warn: #FFC04D; --warn-soft: #4A3A18; --bad: #FF7A8D; --bad-soft: #4B2230;
    --c1: #7C9BFF; --c1s: #26315F; --c2: #FF84A6; --c2s: #4A2540; --c3: #FFC04D; --c3s: #4A3A18;
    --c4: #3FD6C4; --c4s: #17403F; --c5: #B392FF; --c5s: #3A2D6A; --c6: #FF9A6A; --c6s: #4B2D22;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.ic { flex: none; display: block; }
[hidden] { display: none !important; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; margin: 0; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-content: center; transform: rotate(-6deg); }
.today { color: var(--muted); font-size: .85rem; font-weight: 500; }

.hero { position: relative; overflow: hidden; background: var(--sun); color: var(--sun-ink); border-radius: 28px; padding: 20px; display: grid; gap: 16px; }
.hero::before { content: ""; position: absolute; inset-block-start: -38px; inset-inline-end: -30px; width: 124px; height: 124px; border-radius: 50%; background: var(--c2); opacity: .75; }
.hero::after { content: ""; position: absolute; inset-block-end: -28px; inset-inline-end: 64px; width: 72px; height: 72px; border-radius: 20px; transform: rotate(20deg); background: var(--c1); opacity: .6; }
.hero > * { position: relative; z-index: 1; }
.hero-main { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring .trk { fill: none; stroke: rgba(27, 35, 64, .16); stroke-width: 11; }
.ring .arc { fill: none; stroke: var(--sun-ink); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-n { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-n small { font-size: .8rem; font-weight: 600; }
.hello { font-size: .9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hello .link { color: var(--sun-ink); opacity: .75; text-decoration: underline; }
.cheer { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.3; margin: 2px 0 4px; text-wrap: balance; }
.hero-sub { font-size: .9rem; font-weight: 500; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .62); border-radius: 99px; padding: 4px 14px 4px 10px; font-weight: 600; font-size: .88rem; font-variant-numeric: tabular-nums; }
.stat.ok { color: var(--hero-ok); }
.stat.late { color: var(--hero-bad); }

.notice { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 14px; font-size: .9rem; font-weight: 500; }
.notice.join { background: var(--ok-soft); color: var(--ok); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.notice.join b { font-weight: 700; }

.bar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tabs { flex: 1 1 280px; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 5px; }
.tab { border: 0; background: transparent; padding: 9px 6px; border-radius: 13px; cursor: pointer; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.dot { background: var(--c2); color: #fff; border-radius: 99px; font-size: .72rem; line-height: 1; padding: 3px 7px; font-weight: 700; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--c2); color: #fff; border-color: transparent; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #2A0F1B; } }
.btn.small { padding: 5px 12px; font-size: .85rem; border-radius: 10px; }
.btn.warn { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
.btn.good { color: var(--ok); border-color: var(--ok-soft); background: var(--ok-soft); }
.btn:disabled { opacity: .55; cursor: default; }
#addBtn { flex: 1 1 160px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.auth { display: grid; gap: 14px; }
.auth h2 { font-family: var(--f-display); margin: 0; font-size: 1.25rem; }
.auth p { margin: 0; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 8px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.auth form { display: grid; gap: 12px; }
.field small { color: var(--muted); font-size: .78rem; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field label, .field legend { font-size: .82rem; color: var(--muted); font-weight: 600; padding: 0; }
input[type="text"], input[type="password"], input[type="date"] { background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
input[type="text"]:focus, input[type="password"]:focus, input[type="date"]:focus { border-color: var(--accent); outline: none; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; font-size: .88rem; color: var(--muted); }
.choice input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.choice.high input:checked + span { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.choice.mid input:checked + span { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.choice.low input:checked + span { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.choice input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.form-actions { display: flex; gap: 8px; }
@media (max-width: 480px) { .form { grid-template-columns: 1fr; } }

.sec-title { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; margin: 6px 0 0; }
.sec-title .ic { color: var(--c6); }
.list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.row { --sc: var(--c1); --sc-soft: var(--c1s); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; align-items: start; transition: transform .15s ease, box-shadow .15s ease; }
.row:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(27, 35, 64, .08); }
.badge { width: 42px; height: 42px; border-radius: 14px; background: var(--sc-soft); color: var(--sc); display: grid; place-content: center; flex: none; }
.cb { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin: 7px 0 0; border-radius: 50%; border: 2.5px solid var(--sc); background: var(--surface); cursor: pointer; display: grid; place-content: center; transition: background .15s ease, transform .15s ease; }
.cb:hover { transform: scale(1.08); }
.cb:checked { background: var(--ok); border-color: var(--ok); }
.cb:checked::after { content: ""; width: 12px; height: 7px; border: solid var(--on-ok); border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.cb:disabled { opacity: .5; cursor: default; }
.row.done .t { text-decoration: line-through; color: var(--muted); }
.row.done .badge { background: var(--ok-soft); color: var(--ok); }
.t { font-weight: 600; overflow-wrap: anywhere; display: block; padding-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: .8rem; }
.chip-i { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); font-weight: 600; }
.chip-i.subj { background: var(--sc-soft); color: var(--sc); }
.chip-i.high { background: var(--bad-soft); color: var(--bad); }
.chip-i.mid { background: var(--warn-soft); color: var(--warn); }
.chip-i.low { background: var(--ok-soft); color: var(--ok); }
.chip-i.late { background: var(--bad-soft); color: var(--bad); }
.chip-i.soon { background: var(--warn-soft); color: var(--warn); }
.chip-i.peers { background: var(--ok-soft); color: var(--ok); }
.link { border: 0; background: none; padding: 2px 4px; color: var(--muted); cursor: pointer; font-size: .8rem; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--bad); }
.hello .link:hover { color: var(--sun-ink); opacity: 1; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 16px; cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.subj, .person { --sc: var(--c1); --sc-soft: var(--c1s); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 10px; }
.subj-head, .person-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.subj-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.subj-name { font-weight: 700; overflow-wrap: anywhere; }
.count { color: var(--muted); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 12px; background: var(--sc-soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sc); border-radius: 99px; transition: width .4s ease; }
.next { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
.next .ic { color: var(--sc); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; border: 3px solid var(--sc); background: var(--sc-soft); color: var(--sc); display: grid; place-content: center; font-weight: 700; font-family: var(--f-display); }
.who > div { min-width: 0; }
.who .nm { overflow-wrap: anywhere; font-weight: 700; display: block; }
.who .un { color: var(--muted); font-size: .8rem; direction: ltr; unicode-bidi: plaintext; text-align: right; display: block; }
.me-tag { font-size: .72rem; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 0 9px; font-weight: 700; }
.new-tag { font-size: .72rem; background: var(--c2); color: #fff; border-radius: 99px; padding: 0 9px; font-weight: 700; }
.off-tag { font-size: .72rem; background: var(--bad-soft); color: var(--bad); border-radius: 99px; padding: 0 9px; font-weight: 700; }
.crown { color: var(--c3); }
.mem-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; }

.empty { background: var(--surface); border: 2px dashed var(--line); border-radius: 24px; padding: 26px 18px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 6px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 1.1rem; }
.empty p { margin: 0; max-width: 40ch; }
.il-a { fill: var(--c5s); } .il-b { fill: var(--surface); stroke: var(--c5); stroke-width: 2; }
.il-c { fill: var(--c1s); } .il-d { fill: var(--c2); } .il-e { fill: var(--c3); } .il-f { fill: var(--ok); }
.il-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.2em; font-weight: 500; }

.burst { position: fixed; width: 0; height: 0; pointer-events: none; z-index: 50; }
.burst i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) {
  .bar > i, .ring .arc, .row, .cb { transition: none; }
  .row:hover, .cb:hover { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand"><span class="logo" id="logo"></span>متابع المذاكرة</h1>
    <div class="today" id="today"></div>
  </div>

  <div id="notice" class="notice" hidden></div>
  <div id="loading" class="empty">جاري التحميل...</div>

  <section class="panel auth" id="authPanel" hidden>
    <h2>أهلاً بيك</h2>
    <p>ادخل باسم المستخدم وكلمة المرور، أو اعمل حساب جديد لو أول مرة.</p>
    <div class="seg" role="tablist" aria-label="دخول أو حساب جديد">
      <button type="button" role="tab" id="seg-in" aria-selected="true">دخول</button>
      <button type="button" role="tab" id="seg-up" aria-selected="false">حساب جديد</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="a-name">اسمك (بيظهر لزمايلك)</label>
        <input id="a-name" type="text" maxlength="30" autocomplete="name" placeholder="مثلاً: ياسين">
      </div>
      <div class="field">
        <label for="a-user">اسم المستخدم</label>
        <input id="a-user" type="text" maxlength="20" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false" placeholder="yassin">
        <small>حروف إنجليزي وأرقام بس، من 3 لـ 20 حرف</small>
      </div>
      <div class="field">
        <label for="a-pass">كلمة المرور</label>
        <input id="a-pass" type="password" autocomplete="current-password" dir="ltr">
        <small id="passHint" hidden>6 خانات على الأقل، وتقدر تستخدم أي حروف أو أرقام أو رموز</small>
      </div>
      <div class="err" id="authErr" role="status" aria-live="polite"></div>
      <button class="btn primary" id="authBtn" type="submit">دخول</button>
    </form>
  </section>

  <section class="panel auth" id="blockedPanel" hidden>
    <h2>الحساب موقوف</h2>
    <p>صاحب الصفحة أوقف حسابك. لو ده بالغلط كلّمه.</p>
    <button class="btn" id="blockedOut" type="button">خروج</button>
  </section>

  <div id="appBox" hidden style="display:flex;flex-direction:column;gap:16px">
    <div id="joinBanner" class="notice join" hidden>
      <span id="joinText"></span>
      <button class="btn small good" id="joinBtn" type="button">شوفهم</button>
    </div>

    <section class="hero" aria-label="تقدمي">
      <div class="hero-main">
        <div class="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="heroBar">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="trk" cx="50" cy="50" r="42"/>
            <circle class="arc" id="ringArc" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 50 50)"/>
          </svg>
          <div class="ring-n"><div><span id="pct">0</span><small>%</small></div></div>
        </div>
        <div style="min-width:0">
          <div class="hello"><span id="hello"></span><button class="link" id="logoutBtn" type="button">خروج</button></div>
          <div class="cheer" id="cheer">بيحمّل مهامك...</div>
          <div class="hero-sub" id="heroSub"></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="bar-row">
      <div class="tabs" id="tabs" role="tablist" aria-label="العرض">
        <button class="tab" role="tab" id="tab-mine" aria-selected="true" data-tab="mine"></button>
        <button class="tab" role="tab" id="tab-subjects" aria-selected="false" data-tab="subjects"></button>
        <button class="tab" role="tab" id="tab-class" aria-selected="false" data-tab="class"></button>
        <button class="tab" role="tab" id="tab-members" aria-selected="false" data-tab="members" hidden></button>
      </div>
      <button class="btn primary" id="addBtn" type="button" aria-expanded="false" aria-controls="addPanel"></button>
    </div>

    <div class="panel" id="addPanel" hidden>
      <form id="addForm" class="form" autocomplete="off">
        <div class="field full">
          <label for="f-title">المهمة</label>
          <input id="f-title" type="text" maxlength="120" required placeholder="مثلاً: تسليم أسايمنت 2 في هياكل البيانات">
        </div>
        <div class="field">
          <label for="f-subject">المادة</label>
          <input id="f-subject" type="text" maxlength="60" list="subjectList" placeholder="مثلاً: هياكل البيانات">
          <datalist id="subjectList"></datalist>
        </div>
        <div class="field">
          <label for="f-due">المعاد</label>
          <input id="f-due" type="date">
        </div>
        <fieldset class="field full">
          <legend>النوع</legend>
          <div class="choices" id="kinds"></div>
        </fieldset>
        <fieldset class="field full">
          <legend>الأولوية</legend>
          <div class="choices" id="prios"></div>
        </fieldset>
        <div class="form-actions full">
          <button class="btn primary" id="saveBtn" type="submit"></button>
          <button class="btn" id="cancelBtn" type="button">إلغاء</button>
        </div>
      </form>
    </div>

    <div class="err" id="err" role="status" aria-live="polite"></div>
    <main id="view"></main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig } from "./config.js";

/* اسم مستخدم الأدمن (صاحب الصفحة). لازم يكون نفس الاسم المكتوب في firestore.rules */
var ADMIN_USERNAME = 'yossaf';
var EMAIL_DOMAIN = 'users.study-tracker.app';

var PR = { high: 3, mid: 2, low: 1 };

function h(tag, props) {
  var e = document.createElement(tag);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) {
    var kids = [].concat(arguments[i]);
    for (var j = 0; j < kids.length; j++) {
      var c = kids[j];
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
  }
  return e;
}

function subjStyle(name) {
  var s = (name || '').trim() || 'عام', x = 0;
  for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0;
  var n = (x % 6) + 1;
  return '--sc:var(--c' + n + ');--sc-soft:var(--c' + n + 's)';
}
function daysLeft(s) {
  if (!s) return null;
  var p = s.split('-').map(Number);
  var due = new Date(p[0], p[1] - 1, p[2]);
  var n = new Date();
  var t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((due - t) / 864e5);
}
function plural(n) { return n === 1 ? 'يوم' : n === 2 ? 'يومين' : n <= 10 ? n + ' أيام' : n + ' يوم'; }
function dueText(d) {
  if (d == null) return 'من غير معاد';
  if (d < 0) return 'متأخرة ' + plural(-d);
  if (d === 0) return 'النهاردة';
  if (d === 1) return 'بكرة';
  if (d === 2) return 'بعد يومين';
  return 'بعد ' + plural(d);
}
function score(t) {
  var d = daysLeft(t.due);
  var u = d == null ? 1 : d < 0 ? 5 : d <= 2 ? 4 : d <= 7 ? 3 : d <= 14 ? 2 : 1;
  return (PR[t.priority] || 2) * 2 + u;
}
function byImportance(a, b) {
  var s = score(b) - score(a);
  if (s) return s;
  var da = daysLeft(a.due), db_ = daysLeft(b.due);
  return (da == null ? 9999 : da) - (db_ == null ? 9999 : db_);
}

function burst(x, y) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box = h('div', { class: 'burst', style: 'left:' + x + 'px;top:' + y + 'px' });
  for (var i = 0; i < 16; i++) {
    var p = h('i', { style: 'background:' + CONFETTI[i % CONFETTI.length] });
    box.append(p);
    var a = (Math.PI * 2 * i) / 16 + Math.random() * 0.4, r = 40 + Math.random() * 50;
    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + Math.cos(a) * r + 'px,' + (Math.sin(a) * r - 20) + 'px) rotate(' + (Math.random() * 540 - 270) + 'deg)', opacity: 0 }
    ], { duration: 650 + Math.random() * 350, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  }
  document.body.append(box);
  setTimeout(function () { box.remove(); }, 1100);
}

function showErr(e) {
  var code = e && e.code ? e.code : '';
  var msg = 'ماتحفظش. تأكد من النت وجرّب تاني.';
  if (code === 'permission-denied') msg = 'مش مسموح لك بالعملية دي. لو الحساب جديد، حدّث الصفحة.';
  $('err').textContent = msg;
}
function enqueue(fn) {
  pending++;
  chain = chain.then(fn).catch(showErr).then(function () { pending--; });
  return chain;
}
function showNotice(t) { var n = $('notice'); n.textContent = t; n.hidden = !t; }

function saveMyProgress() {
  if (!db || !me) return Promise.resolve();
  return enqueue(function () {
    return setDoc(doc(db, 'progress', me.uid), { done: Object.assign({}, myDone), name: me.name, updatedAt: Date.now() });
  });
}
function toggle(id, on) {
  if (!db || !me) return;
  if (on) myDone[id] = true; else delete myDone[id];
  state.progress[me.uid] = myDone;
  render();
  saveMyProgress();
}
function removeTask(id) {
  if (!db) return;
  enqueue(function () { return deleteDoc(doc(db, 'tasks', id)); });
}
function setMemberStatus(id, status) {
  if (!db || !me || !me.isAdmin) return;
  enqueue(function () { return updateDoc(doc(db, 'members', id), { status: status }); });
}

function totals() {
  var all = state.tasks;
  var done = all.filter(function (t) { return myDone[t.id]; });
  var late = all.filter(function (t) { return !myDone[t.id] && daysLeft(t.due) != null && daysLeft(t.due) < 0; });
  return { all: all.length, done: done.length, left: all.length - done.length, late: late.length };
}
function cheerText(p, all) {
  if (!state.loaded) return 'بيحمّل مهامك...';
  if (!all) return 'ضيف أول مهمة وابدأ';
  if (p === 100) return 'خلصت كل حاجة، برافو عليك';
  if (p >= 75) return 'قربت تخلص، كمّل';
  if (p >= 40) return 'ماشي كويس، كمّل';
  if (p > 0) return 'بداية حلوة';
  return 'يلا نبدأ بأول مهمة';
}

function renderHero() {
  var t = totals();
  var p = t.all ? Math.round((t.done / t.all) * 100) : 0;
  $('pct').textContent = p;
  $('heroBar').setAttribute('aria-valuenow', p);
  $('ringArc').setAttribute('stroke-dashoffset', 100 - p);

  $('hello').textContent = greet + (me ? ' يا ' + me.name : '');
  $('cheer').textContent = cheerText(p, t.all);
  $('heroSub').textContent = t.all ? 'خلصت ' + t.done + ' من ' + t.all + ' مهمة' : '';
  var s = $('stats');
  s.textContent = '';

    h('span', { class: 'stat ok' }, icon('check', 16), 'خلصت ' + t.done),

function taskRow(t) {
  var done = !!myDone[t.id];
  var d = daysLeft(t.due);
  var peers = 0;
  Object.keys(state.progress).forEach(function (u) {
    if (me && u !== me.uid && state.progress[u] && state.progress[u][t.id]) peers++;
  });
  var cls = !done && d != null && d < 0 ? 'late' : !done && d != null && d <= 2 ? 'soon' : '';
  var dueLabel = t.due ? fmt(new Date(t.due + 'T00:00:00'), { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + dueText(d) : dueText(d);
  var cb = h('input', {
    type: 'checkbox', class: 'cb', id: 'cb-' + t.id, checked: done, disabled: !me,
    'aria-label': 'خلصت ' + t.title,
    onchange: function (e) {
      if (e.target.checked) {
        var r = e.target.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2);
      }
      toggle(t.id, e.target.checked);
    }
  });
  var canDelete = me && (me.isAdmin || t.by === me.uid);
  var pr = t.priority || 'mid';
  return h('li', { class: 'row' + (done ? ' done' : ''), style: subjStyle(t.subject) },
    cb,
    h('span', { class: 'badge', 'aria-hidden': 'true' }, icon(KIND_ICON[t.kind] || 'book', 22)),
    h('div', { style: 'min-width:0' },
      h('label', { for: 'cb-' + t.id, class: 't', text: t.title }),

        !done ? h('span', { class: 'chip-i ' + pr }, icon(PRI[pr], 14), PRL[pr]) : null,
        h('span', { class: 'chip-i ' + cls }, icon('clock', 14), dueLabel),

      )

}

function viewMine() {
  var f = state.filter;
  var box = h('div', { style: 'display:flex;flex-direction:column;gap:12px' });
  var chips = h('div', { class: 'filters' });
  [['pending', 'لسه'], ['done', 'خلصت'], ['all', 'الكل']].forEach(function (x) {
    chips.append(h('button', {
      class: 'chip', type: 'button', 'aria-pressed': f === x[0],
      onclick: function () { state.filter = x[0]; render(); }
    }, x[1]));
  });
  box.append(chips);
  if (!state.tasks.length) { box.append(emptyState()); return box; }
  var pend = state.tasks.filter(function (t) { return !myDone[t.id]; }).sort(byImportance);
  var dn = state.tasks.filter(function (t) { return myDone[t.id]; }).sort(byImportance);

function viewSubjects() {
  var groups = {};
  state.tasks.forEach(function (t) {
    var k = (t.subject || '').trim() || 'عام';
    (groups[k] = groups[k] || []).push(t);
  });
  var names = Object.keys(groups);
  if (!names.length) return emptyState();
  names.sort(function (a, b) {
    var pa = groups[a].filter(function (t) { return !myDone[t.id]; }).length;
    var pb = groups[b].filter(function (t) { return !myDone[t.id]; }).length;
    return pb - pa;
  });
  return h('div', { class: 'list' }, names.map(function (n) {
    var ts = groups[n];
    var dn = ts.filter(function (t) { return myDone[t.id]; }).length;
    var left = ts.filter(function (t) { return !myDone[t.id]; }).sort(byImportance);
    var p = Math.round((dn / ts.length) * 100);
    var next = left[0];
    return h('div', { class: 'subj', style: subjStyle(n === 'عام' ? '' : n) },
      h('div', { class: 'subj-head' },

        self ? null : (blocked
          ? h('button', { class: 'btn small good', type: 'button', onclick: function () { setMemberStatus(m.id, 'active'); } }, 'رجّعه')
          : h('button', { class: 'btn small warn', type: 'button', onclick: function () { setMemberStatus(m.id, 'blocked'); } }, 'إيقاف'))
      )
    );
  })));
  return box;
}

function newMembersCount() {
  if (!me || !me.isAdmin) return 0;
  var seen = Number(lsGet('st_seen_' + me.uid)) || 0;
  return state.members.filter(function (m) { return m.id !== me.uid && m.joinedAt > seen; }).length;
}
function setTab(t) {
  state.tab = t;
  if (t === 'members' && me && me.isAdmin) {
    state.seenSnap = Number(lsGet('st_seen_' + me.uid)) || 0;
    lsSet('st_seen_' + me.uid, String(Date.now()));
  }
  render();
}

function render() {
  $('loading').hidden = authReady;
  $('authPanel').hidden = !authReady || !!me;
  var blocked = !!(me && me.blocked);
  $('blockedPanel').hidden = !blocked;
  var showApp = !!me && !blocked;
  $('appBox').hidden = !showApp;
  if (!showApp) return;

  renderHero();
  var isAdmin = me.isAdmin;
  var nNew = newMembersCount();
  $('tab-members').hidden = !isAdmin;
  $('tabs').style.gridTemplateColumns = 'repeat(' + (isAdmin ? 4 : 3) + ', minmax(0, 1fr))';
  var mt = $('tab-members');
  var old = mt.querySelector('.dot');
  if (old) old.remove();
  if (nNew > 0 && state.tab !== 'members') mt.append(h('span', { class: 'dot', text: nNew }));

  var jb = $('joinBanner');
  jb.hidden = !(isAdmin && nNew > 0 && state.tab !== 'members');
  if (!jb.hidden) $('joinText').textContent = nNew === 1 ? 'انضم عضو جديد' : 'انضم ' + nNew + ' أعضاء جدد';

  var dl = $('subjectList');
  var seen = {};
  dl.textContent = '';
  state.tasks.forEach(function (t) {
    var s = (t.subject || '').trim();
    if (s && !seen[s]) { seen[s] = 1; dl.append(h('option', { value: s })); }
  });
  if (state.tab === 'members' && !isAdmin) state.tab = 'mine';
  ['mine', 'subjects', 'class', 'members'].forEach(function (k) { $('tab-' + k).setAttribute('aria-selected', state.tab === k); });
  var node = state.tab === 'mine' ? viewMine() : state.tab === 'subjects' ? viewSubjects() : state.tab === 'class' ? viewClass() : viewMembers();
  var v = $('view');
  v.textContent = '';
  v.append(node);
}

document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
});
$('joinBtn').addEventListener('click', function () { setTab('members'); });
$('addBtn').addEventListener('click', function () {
  var p = $('addPanel');
  p.hidden = !p.hidden;
  $('addBtn').setAttribute('aria-expanded', String(!p.hidden));
  if (!p.hidden) $('f-title').focus();
});
$('cancelBtn').addEventListener('click', function () {
  $('addPanel').hidden = true;
  $('addBtn').setAttribute('aria-expanded', 'false');
});
$('addForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!db || !me) return;
  var title = $('f-title').value.trim();
  if (!title) return;
  var k = document.querySelector('input[name="kind"]:checked');
  var pr = document.querySelector('input[name="priority"]:checked');
  var data = {
    title: title,
    subject: $('f-subject').value.trim(),
    kind: k ? k.value : 'تسليم',
    priority: pr ? pr.value : 'mid',
    due: $('f-due').value || '',
    by: me.uid,
    at: Date.now()
  };
  $('err').textContent = '';
  $('saveBtn').disabled = true;
  enqueue(function () { return addDoc(collection(db, 'tasks'), data); }).then(function () {
    $('saveBtn').disabled = false;
    if (!$('err').textContent) {
      $('f-title').value = '';
      $('f-due').value = '';
      $('f-title').focus();
    }
  });
});

/* ---------- الحسابات ---------- */
function setMode(m) {
  state.mode = m;
  var up = m === 'up';
  $('seg-in').setAttribute('aria-selected', String(!up));
  $('seg-up').setAttribute('aria-selected', String(up));
  $('nameField').hidden = !up;
  $('passHint').hidden = !up;
  $('a-pass').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
  $('authBtn').textContent = up ? 'إنشاء الحساب' : 'دخول';
  $('authErr').textContent = '';
}
$('seg-in').addEventListener('click', function () { setMode('in'); });
$('seg-up').addEventListener('click', function () { setMode('up'); });

function authMessage(e) {
  var c = e && e.code ? e.code : '';
  if (c === 'auth/email-already-in-use') return 'اسم المستخدم ده مستخدم. جرّب اسم تاني.';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'اسم المستخدم أو كلمة المرور غلط.';
  if (c === 'auth/weak-password') return 'كلمة المرور ضعيفة. استخدم 6 حروف أو أكتر.';
  if (c === 'auth/too-many-requests') return 'محاولات كتير. استنى شوية وجرّب تاني.';
  if (c === 'auth/network-request-failed') return 'مفيش نت. تأكد من الاتصال وجرّب تاني.';
  if (c === 'auth/operation-not-allowed') return 'تسجيل الدخول بكلمة المرور مش متفعّل في Firebase. فعّله من Authentication.';
  return 'حصلت مشكلة. جرّب تاني.';
}
$('authForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!auth) return;
  var user = $('a-user').value.trim().toLowerCase();
  var pass = $('a-pass').value;
  var name = $('a-name').value.trim();
  var up = state.mode === 'up';
  var err = $('authErr');
  err.textContent = '';
  if (!/^[a-z0-9._]{3,20}$/.test(user)) { err.textContent = 'اسم المستخدم لازم يكون حروف إنجليزي وأرقام بس، من 3 لـ 20 حرف.'; return; }
  if (up && !name) { err.textContent = 'اكتب اسمك اللي هيظهر لزمايلك.'; return; }
  if (!pass) { err.textContent = 'اكتب كلمة المرور.'; return; }
  if (up && pass.length < 6) { err.textContent = 'كلمة المرور لازم تكون 6 حروف أو أكتر.'; return; }
  $('authBtn').disabled = true;
  try {
    var email = user + '@' + EMAIL_DOMAIN;
    if (up) { pendingName = name; await createUserWithEmailAndPassword(auth, email, pass); }
    else { await signInWithEmailAndPassword(auth, email, pass); }
    $('a-pass').value = '';
  } catch (ex) {
    pendingName = '';
    err.textContent = authMessage(ex);
  }
  $('authBtn').disabled = false;
});
function logout() { if (auth) signOut(auth); }
$('logoutBtn').addEventListener('click', logout);
$('blockedOut').addEventListener('click', logout);

function stopListeners() {
  unsubs.forEach(function (u) { try { u(); } catch (e) {} });
  unsubs = [];
}
function resetData() {
  stopListeners();
  me = null; myDone = {};
  state.tasks = []; state.progress = {}; state.names = {}; state.members = []; state.loaded = false; state.tab = 'mine';
}

async function ensureMember(user) {
  var ref = doc(db, 'members', user.uid);
  var snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  var uname = (user.email || '').split('@')[0];
  var data = { username: uname, name: pendingName || uname, joinedAt: Date.now(), status: 'active' };
  await setDoc(ref, data);
  return data;
}

function startListeners() {
  var fail = function () {
    state.loaded = true;
    showNotice('مش قادر أتصل بقاعدة البيانات. راجع النت وقواعد Firestore.');
    render();
  };
  unsubs.push(onSnapshot(collection(db, 'tasks'), function (s) {
    state.tasks = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    state.loaded = true;
    showNotice('');
    render();
  }, fail));
  unsubs.push(onSnapshot(collection(db, 'progress'), function (s) {
    var next = {}, names = {};
    s.docs.forEach(function (d) {
      var v = d.data() || {};
      next[d.id] = v.done || {};
      names[d.id] = v.name || '';
    });
    if (pending > 0) next[me.uid] = myDone;
    else myDone = Object.assign({}, next[me.uid] || {});
    state.progress = next;
    state.names = names;
    render();
  }, fail));
  if (me.isAdmin) {
    unsubs.push(onSnapshot(collection(db, 'members'), function (s) {
      state.members = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (state.tab === 'members') lsSet('st_seen_' + me.uid, String(Date.now()));
      render();
    }, fail));
  }
}

async function onUser(user) {
  resetData();
  if (!user) { authReady = true; render(); return; }
  try {
    var m = await ensureMember(user);
    pendingName = '';
    var uname = (user.email || '').split('@')[0];
    me = { uid: user.uid, username: uname, name: m.name || uname, isAdmin: uname === ADMIN_USERNAME, blocked: m.status === 'blocked' };
    authReady = true;
    if (me.blocked) { render(); return; }
    render();
    startListeners();
  } catch (e) {
    authReady = true;
    showNotice('مش قادر أحمّل حسابك. راجع القواعد في Firebase وحدّث الصفحة.');
    render();
  }
}

function boot() {
  render();
  var cfg = firebaseConfig || {};
  if (!cfg.projectId || String(cfg.projectId).indexOf('PASTE') === 0) {
    authReady = true; $('loading').hidden = true;
    showNotice('الموقع لسه ماتوصّلش بقاعدة البيانات. افتح ملف config.js وحط إعدادات Firebase.');
    return;
  }
  try {
    var app = initializeApp(cfg);
    db = getFirestore(app);
    auth = getAuth(app);
  } catch (e) {
    authReady = true; $('loading').hidden = true;
    showNotice('إعدادات Firebase فيها مشكلة. راجع ملف config.js.');
    return;
  }
  onAuthStateChanged(auth, function (u) { onUser(u); });
}
boot();
</script>
</body>
</html>
